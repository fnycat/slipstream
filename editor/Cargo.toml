[package]
name = "mktools"
description = "Editor for Mario Kart Wii files"
version = "0.1.0"
edition = "2024"
license = "Apache 2.0"
repository = "https://github.com/RadiatedMonkey/mktools"
build = "build.rs"

[lib]
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
tracing-wasm = "0.2.1"

wgpu = { version = "30.0.1", features = ["webgl"] }
wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.30"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
wgpu = "30.0.1"
pollster = "1.0.1"

[dependencies]
szslib = { path = "../szstools" }

bytemuck = "1.25.2"
color-eyre = "0.6.5"
eyre = "0.6.14"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tracing-tree = "0.4.1"
winit = "0.30.13"
egui = "0.36.2"
eframe = "0.36.2"
egui_extras = { version = "0.36.2", features = ["image"] }
egui-phosphor = "0.14.0"
rfd = "0.17.2"

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo", "rustc", "si"] }
