[package]
name = "slipstream-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

slipstream-ir = { path = "../slipstream-ir", default-features = false }
slipstream-shared = { path = "../slipstream-shared", default-features = false }

[[bin]]
name = "full"
path = "fuzz_targets/full.rs"
test = false
doc = false
bench = false

[[bin]]
name = "brres"
path = "fuzz_targets/brres.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chr"
path = "fuzz_targets/chr.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mdl"
path = "fuzz_targets/mdl.rs"
test = false
doc = false
bench = false

[[bin]]
name = "tex"
path = "fuzz_targets/tex.rs"
test = false
doc = false
bench = false

[[bin]]
name = "kmp"
path = "fuzz_targets/kmp.rs"
test = false
doc = false
bench = false
