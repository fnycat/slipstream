[package]
name = "slipstream-ir"
version = "0.1.0"
edition = "2024"

[features]
default = ["egui-impls"]

# Enables all `egui` functionality. Disabling this feature will remove the `egui` and `wgpu` dependencies
# and any `egui` related code (this includes the `Inspect` implementations)
egui-impls = ["egui", "egui_extras", "wgpu", "eframe"]

[dependencies]
slipstream-derive = { path = "../slipstream-derive" }
slipstream-shared = { path = "../slipstream-shared" }

wgpu = { workspace = true, optional = true }
egui = { workspace = true, optional = true }
egui_extras = { workspace = true, optional = true }
eframe = { workspace = true, optional = true }

byteorder.workspace = true
tracing.workspace = true
glam.workspace = true
bitfield-struct.workspace = true

parking_lot = { version = "0.12.5", features = ["arc_lock"] }
dashmap = "6.2.1"
strum = { version = "0.28.0", features = ["derive"] }
paste = "1.0.15"
bytemuck = "1.25.2"
nohash-hasher = "0.2.0"
rayon = "1.12.0"
parking_lot_core = "0.9.12"
downcast-rs = "2.0.2"
