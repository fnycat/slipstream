[workspace]
resolver = "3"
members = ["slipstream", "slipstream-derive", "slipstream-ir", "slipstream-shared", "fuzz"]

[workspace.dependencies]
egui = { version = "0.36.2", features = ["rayon"] }
glam = { version = "0.34.1", features = ["bytemuck"] }
wgpu = { version = "30.0.1", features = ["webgl"] }
eframe = "0.36.2"
egui_extras = { version = "0.37.0", features = ["image"] }
egui-phosphor = { version = "0.14.0", features = ["fill", "subset"] }
tracing = "0.1.44"
byteorder = "1.5.0"
bitfield-struct = "0.13.0"
image = { version = "0.25.10", default-features = false, features = ["rayon", "jpeg", "png", "webp"] }
bytemuck = "1.25.2"
futures = { version = "0.3.34", features = ["executor"] }
