[package]
name = "slipstream"
description = "Editor for Mario Kart Wii files"
version = "0.1.0"
edition = "2024"
license = "Apache 2.0"
repository = "https://github.com/fnycat/slipstream"
build = "build.rs"

[features]
# Cargo cannot conditionally disable crate features depending on build profile.
# Therefore this feature will have to be manually enabled by the user.
glam-assert = ["glam/glam-assert"]

[lib]
name = "slipstream_core"
crate-type = ["cdylib", "rlib"]

[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.6"
tracing-wasm = "0.2.1"
web-sys = "0.3.105"

wasm-bindgen = "0.2.128"
wasm-bindgen-futures = "0.4.30"

[dependencies]
slipstream-ir = { path = "../slipstream-ir" }
slipstream-shared = { path = "../slipstream-shared" }

wgpu.workspace = true
glam.workspace = true
egui.workspace = true
eframe.workspace = true
egui_extras.workspace = true
egui-phosphor.workspace = true
tracing.workspace = true
byteorder.workspace = true
bitfield-struct.workspace = true
futures.workspace = true

bytemuck = "1.25.2"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tracing-tree = "0.4.1"
winit = "0.30.13"
rfd = "0.17.2"
paste = "1.0.15"
parking_lot = { version = "0.12.5", features = ["arc_lock"] }
egui_tiles = "0.17.1"
strum = { version = "0.28.0", features = ["derive"] }

[build-dependencies]
vergen-gitcl = { version = "10.0.3", features = ["build", "cargo", "rustc", "si"] }
